services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: intelligent_inbox
      POSTGRES_USER: intelligent_inbox
      POSTGRES_PASSWORD: intelligent_inbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligent_inbox -d intelligent_inbox"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - intelligent_inbox_pg:/var/lib/postgresql/data

volumes:
  intelligent_inbox_pg:
